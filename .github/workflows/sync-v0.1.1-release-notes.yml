name: Sync v0.1.1 release notes (one time)

on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES.md

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing v0.1.1 release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -q '^# v0.1.1' RELEASE_NOTES.md
          gh release edit v0.1.1 --notes-file RELEASE_NOTES.md
