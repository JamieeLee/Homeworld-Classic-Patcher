name: Publish Homeworld Classic Patcher v0.1.1

on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patcher sources
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Patch-Homeworld1Classic.ps1').Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw 'PowerShell syntax validation failed.'
          }
          Write-Host 'PowerShell syntax validated.'

      - name: Validate all 74 byte patches
        run: |
          python3 - <<'PYVALIDATE'
          import json, pathlib
          d = json.loads(pathlib.Path('patches.json').read_text(encoding='utf-8'))
          assert d['version'] == '2.303'
          assert d['patch_count'] == len(d['patches']) == 74
          assert d['source_file_name'] == 'Homeworld.exe'
          for key in ('source_sha256', 'patched_sha256'):
              assert len(d[key]) == 64 and all(c in '0123456789abcdef' for c in d[key])
          ranges = []
          for p in d['patches']:
              old, new, offset = bytes.fromhex(p['old']), bytes.fromhex(p['new']), p['offset']
              assert len(old) == len(new) and len(old) > 0
              assert 0 <= offset <= d['source_size'] - len(old)
              ranges.append((offset, offset + len(old)))
          ranges.sort()
          assert all(a[1] <= b[0] for a,b in zip(ranges, ranges[1:]))
          print('Validated 74 non-overlapping patches.')
          PYVALIDATE

      - name: Package and publish v0.1.1 pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo 'Release v0.1.1 already exists; skipping.'
            exit 0
          fi
          zip -j -q -9 Homeworld1Classic_Reusable_Offline_Patcher_2.303.zip \
            RUN_PATCHER.cmd Patch-Homeworld1Classic.ps1 patches.json README.md
          sha256sum Homeworld1Classic_Reusable_Offline_Patcher_2.303.zip > SHA256SUMS.txt
          gh release create v0.1.1 \
            Homeworld1Classic_Reusable_Offline_Patcher_2.303.zip SHA256SUMS.txt \
            --title 'v0.1.1 — Steam Auto-Detection' \
            --target "$GITHUB_SHA" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
