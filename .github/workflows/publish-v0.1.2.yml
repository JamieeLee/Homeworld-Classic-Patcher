name: Publish Homeworld Classic Patcher v0.1.2

on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          foreach ($file in @('Patch-Homeworld1Classic.ps1', 'tests/Windows-SmokeTests.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell syntax validation failed: $file"
            }
            Write-Host "PASS: $file PowerShell syntax"
          }

      - name: Test Steam and GOG detection and strict hash refusal
        shell: pwsh
        run: |
          & .\tests\Windows-SmokeTests.ps1
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "Windows smoke test failed: $LASTEXITCODE" }

      - name: Verify launcher asks before any policy bypass
        shell: pwsh
        run: |
          $text = Get-Content RUN_PATCHER.cmd -Raw
          if (-not $text.Contains('powershell.exe -NoProfile -File ')) { throw 'Missing normal no-bypass startup.' }
          if (-not $text.Contains('choice /C YN ')) { throw 'Missing opt-in question.' }
          if (-not $text.Contains('if errorlevel 2 goto MANUAL')) { throw 'No must remain non-bypass.' }
          if (-not $text.Contains('powershell.exe -NoProfile -ExecutionPolicy Bypass -File ')) { throw 'Missing optional one-run retry.' }
          Write-Host 'PASS: normal policy default, optional bypass only after Y.'

  manifest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all patch bytes and complete documentation
        run: |
          python3 - <<'PYVALIDATE'
          import json, pathlib, re
          d=json.loads(pathlib.Path('patches.json').read_text())
          assert d['version']=='2.303'
          assert d['patch_count']==len(d['patches'])==74
          assert d['source_file_name']=='Homeworld.exe'
          assert d['source_sha256']=='421c114e832c56bd1994fe97c342969ef69881bb74399e67bef979c6923df381'
          assert d['patched_sha256']=='166c3a23a0eeb5789823602b2571be98ae926a9447376c4b843ac0d1179884fb'
          positions=[]
          for p in d['patches']:
              original=bytes.fromhex(p['old'])
              new=bytes.fromhex(p['new'])
              offset=p['offset']
              assert original and len(original)==len(new)
              assert 0<=offset<=d['source_size']-len(original)
              positions.append((offset,offset+len(original)))
          positions.sort()
          assert all(a[1]<=b[0] for a,b in zip(positions,positions[1:]))
          doc=pathlib.Path('PATCH_REFERENCE.md').read_text()
          rows=re.findall(r'^\|\s*(\d+)\s*\|\s*',doc,re.M)
          assert rows==list(map(str,range(1,75))), f'Patch reference has {len(rows)} indexed rows, expected 74'
          for p in d['patches']:
              assert f'0x{p["offset"]:X}' in doc
              assert p['old'].upper() in doc and p['new'].upper() in doc
          assert 'Copyright (c) 2026 louthelou' in pathlib.Path('THIRD_PARTY_NOTICES.md').read_text()
          assert 'Copyright (c) 2026 Jamie Linux' in pathlib.Path('LICENSE').read_text()
          print('PASS: 74 patches, non-overlap, documentation and MIT notices.')
          PYVALIDATE

  release:
    needs: [windows-tests, manifest-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish v0.1.2 pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.2 >/dev/null 2>&1; then
            echo 'v0.1.2 release already exists; refusing to overwrite its assets.'
            exit 0
          fi
          zip -j -q -9 Homeworld1Classic_Reusable_Offline_Patcher_2.303.zip \
            RUN_PATCHER.cmd Patch-Homeworld1Classic.ps1 patches.json README.md \
            PATCH_REFERENCE.md THIRD_PARTY_NOTICES.md LICENSE
          sha256sum Homeworld1Classic_Reusable_Offline_Patcher_2.303.zip > SHA256SUMS.txt
          gh release create v0.1.2 \
            Homeworld1Classic_Reusable_Offline_Patcher_2.303.zip SHA256SUMS.txt \
            --title 'v0.1.2 — Steam & GOG Auto-Detection' \
            --target "$GITHUB_SHA" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
